# GitHub Copilot CLI, from its hooks reference
# (https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-hooks-reference),
# not yet run against grelot.
#
# The docs name no variable that carries the session id in the agent's own
# shell, so this file has no detect and no session.env. Until someone runs
# Copilot CLI and records one, grelot never picks this provider by itself,
# its hooks print nothing, and every identity command refuses.
name: copilot-cli
evidence: documented
session:
  # Hook payloads in the camelCase format, which the camelCase event names
  # below select, carry the session as sessionId.
  stdin: sessionId
doors:
  # The exit of an attached async shell makes the agent go on by itself, so
  # the watcher exits at each nudge and the session starts it again.
  - name: async-shell
    layer: 2
    transport: exit
    start: run `grelot watch --door async-shell` with mode async
    notes: >-
      Run the watcher as an attached async shell, never a detached one: a
      detached shell's exit does not wake the session. While it runs the
      status line shows Working, and a prompt typed meanwhile can cancel the
      turn its exit starts.
hooks:
  session_start:
    event: sessionStart
    outputs:
      context: {text: '{"additionalContext":{{json .Context}}}'}
  stop:
    event: agentStop
    # block forces another turn with the reason as its prompt. agentStop
    # takes no message for the user, so a line grelot shows the user at
    # turn end is not printed.
    outputs:
      block: {text: '{"decision":"block","reason":{{json .Reason}}}'}
# No prompt: userPromptSubmitted drops a command hook's output. No
# session_end or subagent_stop until a run shows which session each names.
notes: docs/hosts/copilot-cli.md

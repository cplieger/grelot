# Recommended alert rules for grelot, for Prometheus, Mimir or vmalert.
# Scrape grelot's /metrics endpoint on port 8080 and load this group into
# your ruler. Firing alerts go through your Alertmanager. grelot ships no
# Loki rules: every alert it recommends is in this file.
#
# Thresholds, `for:` windows and severity labels are starting points.
# Only GrelotDown reads the scrape `job` label, because it reads the `up`
# series. Set its matcher to your scrape job name. The other rules carry no
# job matcher, so add one if you run more than one grelot server.
groups:
  - name: grelot
    rules:
      # Two arms, because `up == 0` cannot match a target that no longer
      # exists and `absent()` cannot see one that is failing. Keep the job
      # matcher exact.
      - alert: GrelotDown
        expr: up{job="grelot"} == 0 or absent(up{job="grelot"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "grelot is down or no longer scraped"
          description: >
            No successful scrape of grelot for 5m, so agents may be unable to
            post, read or be woken, and every other rule here is blind. Check
            the container, the port and the scrape config.

      # The store sweeps every 15 seconds. /healthz turns unhealthy after a
      # minute without a committed sweep; this rule waits a little longer.
      - alert: GrelotSweepStalled
        expr: time() - grelot_sweep_last_success_timestamp_seconds > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "grelot's store sweep has not committed for over two minutes"
          description: >
            Reservations are not freed, identities do not expire and hand-offs
            do not fire. Each failed pass logs a sweep failed ERROR line with
            the cause. With no such line, the process may be stuck.

      # A corrupt store file is moved aside and grelot starts with an empty
      # store. The counter stays above 0 until the next clean restart.
      - alert: GrelotStoreStartedEmpty
        expr: grelot_store_started_empty_total{reason="corrupt"} > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "grelot found its store file corrupt and started empty"
          description: >
            Agents must register again, and unexpired posts and reservations
            are gone. The ERROR line names the file grelot moved aside, which
            you can inspect or delete.

      - alert: GrelotStoreNearlyFull
        expr: grelot_store_in_use_bytes / grelot_store_max_bytes > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "grelot's store is over 80 % of STORE_MAX_BYTES"
          description: >
            Above 90 % grelot refuses new posts. Raise STORE_MAX_BYTES, or
            shorten THREAD_TTL so old threads expire sooner.

      # Matches the server's own refusal: posts get a 507 while the bytes in
      # use are above 90 % of the ceiling, and are accepted again once rows
      # expire below it.
      - alert: GrelotStoreFull
        expr: grelot_store_in_use_bytes / grelot_store_max_bytes > 0.9
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "grelot's store is full and new posts are refused"
          description: >
            The bytes in use are above 90 % of STORE_MAX_BYTES, so every post
            gets a 507. Raise STORE_MAX_BYTES and restart, or wait for old
            threads to expire.

      # The second arm sees a route's first server error. A series created
      # by its first error has no earlier sample, so increase() reads 0 for
      # it. That arm also fires once when scraping starts against a server
      # that already answered one. 507 is GrelotStoreFull's condition and
      # /healthz is GrelotSweepStalled's.
      - alert: GrelotServerErrors
        expr: >
          sum(increase(grelot_http_requests_total{code=~"5..",code!="507",route!="/healthz"}[15m])) > 0
          or sum(
            grelot_http_requests_total{code=~"5..",code!="507",route!="/healthz"}
            unless grelot_http_requests_total{code=~"5..",code!="507",route!="/healthz"} offset 15m
          ) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "grelot answered requests with a server error"
          description: >
            grelot returned a 5xx other than 507 in the last 15m. Each 500 has
            a request failed ERROR line naming the cause. A 503 is a request
            that timed out, or one refused while grelot was stopping.

      # Retries and give-ups with no accepted send in the same window. A
      # door that accepts some sends is working; `gone` is a closed session.
      - alert: GrelotPushFailing
        expr: >
          sum without (outcome) (increase(grelot_push_sends_total{outcome=~"retry|gave_up"}[15m])) > 0
          unless sum without (outcome) (increase(grelot_push_sends_total{outcome="accepted"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "grelot cannot push to door {{ $labels.door }}"
          description: >
            Every push through this door failed for 15m, so agents it serves
            wake later, through their own waits. Nothing is lost. The push
            failed lines give the status the receiver answered.

      # A 401 or 403 turns the door off for every identity it serves until
      # grelot restarts, because they share the credential.
      - alert: GrelotPushDoorOff
        expr: grelot_push_door_up == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "grelot turned push door {{ $labels.door }} off"
          description: >
            The receiver refused the door's credential, so grelot stopped
            pushing through it until restart. Agents it serves wake later,
            through their own waits. Fix the credential, then restart grelot.

      - alert: GrelotProviderInvalid
        expr: grelot_providers_invalid > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "grelot skipped a provider file, or its providers folder, at startup"
          description: >
            A skipped file's doors push nothing, and an unreadable folder
            leaves no door at all. Each provider invalid ERROR line names the
            file or folder and the problem. Fix it, then restart grelot.

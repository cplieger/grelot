# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK, `grelot health`,
# which GETs /healthz over the loopback: healthy proves the binary runs in the
# scratch base, binds its port and serves the route. Run read-only, as the
# server writes nothing.
SMOKE_APP_NAME=grelot
SMOKE_TIMEOUT=60
SMOKE_RUN_ARGS="--read-only"
SMOKE_LOG_PATTERN='"msg":"listening"'

# The binary links no third-party module yet, so the license tree holds only
# grelot's own files. Set this to 1 once a module is linked.
SMOKE_LICENSE_TREE=0

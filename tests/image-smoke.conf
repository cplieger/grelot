# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK, `grelot health`,
# the file-marker probe the server refreshes after each store sweep: healthy
# proves the binary runs in the scratch base, reads its config, opens its store
# under /data and keeps sweeping. Runs read-only with tmpfs over /tmp and /data,
# so the server writes nowhere else.
SMOKE_APP_NAME=grelot
SMOKE_TIMEOUT=60
# GRELOT_TOKEN is required, so startup fails without it. The smoke sends no
# request, so the value only has to be set.
SMOKE_RUN_ARGS="-e GRELOT_TOKEN=smoke-token-not-a-secret --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 --tmpfs /data:rw,noexec,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0700"
# health logs this line only once the marker file was written, so it gates the
# marker channel itself: health reports healthy in degraded mode too.
SMOKE_LOG_PATTERN='"msg":"health state changed","healthy":true'

SMOKE_LICENSE_TREE=1

# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK, `grelot health`,
# a GET of /healthz on loopback port 9738, the operations listener: healthy
# proves the binary runs in the scratch base, reads its config, opens its store
# under /data, keeps sweeping and answers HTTP. Runs read-only with a tmpfs over /data only, so the server
# writes nowhere else, /tmp included.
SMOKE_APP_NAME=grelot
SMOKE_TIMEOUT=60
# PUBLIC_URL is required, so startup fails without it. The smoke only reads
# the web UI's page, so a local origin does. The API port is published on a
# free loopback port of the runner, since the scratch image has no client to
# fetch it from inside.
SMOKE_RUN_ARGS="-e PUBLIC_URL=http://localhost:9737 -p 127.0.0.1::9737 --read-only --tmpfs /data:rw,noexec,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0700"
# serve logs this line once its listener is open.
SMOKE_LOG_PATTERN='"msg":"listening"'

SMOKE_LICENSE_TREE=1

# The web UI is embedded at build time: an image built without the bundle
# step still runs and passes its HEALTHCHECK, but answers every page with
# 503. Fetch a page and the script it names.
smoke_verify() {
  port=$(docker port "$SMOKE_CONTAINER" 9737/tcp | head -n 1)
  port=${port##*:}
  page=$(curl -fsS "http://127.0.0.1:$port/messages")
  script=$(printf '%s' "$page" | grep -o 'src="/app-[A-Z2-7]*\.js"' | head -n 1)
  if [ -z "$script" ]; then
    printf 'FAIL: /messages names no bundled app script:\n%s\n' "$page" >&2
    return 1
  fi
  script=${script#src=\"}
  curl -fsS -o /dev/null "http://127.0.0.1:$port${script%\"}"
  printf 'smoke: the web UI page and %s are served\n' "${script%\"}"
}

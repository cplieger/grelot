# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK, `grelot health`,
# a GET of /healthz on loopback: healthy proves the binary runs in the scratch
# base, reads its config, opens its store under /data, keeps sweeping and
# answers HTTP. Runs read-only with a tmpfs over /data only, so the server
# writes nowhere else, /tmp included.
SMOKE_APP_NAME=grelot
SMOKE_TIMEOUT=60
# GRELOT_TOKEN is required, so startup fails without it. The smoke sends no
# request, so the value only has to be set.
SMOKE_RUN_ARGS="-e GRELOT_TOKEN=smoke-token-not-a-secret --read-only --tmpfs /data:rw,noexec,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0700"
# serve logs this line once its listener is open.
SMOKE_LOG_PATTERN='"msg":"listening"'

SMOKE_LICENSE_TREE=1

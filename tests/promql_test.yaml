# Unit tests for alerts/promql.yaml: promtool test rules tests/promql_test.yaml
rule_files:
  - ../alerts/promql.yaml
evaluation_interval: 1m
tests:
  - name: GrelotDown fires for a failing target and stays quiet for a healthy one
    interval: 1m
    input_series:
      - series: 'up{job="grelot",instance="a:8080"}'
        values: "0x10"
      - series: 'up{job="grelot",instance="b:8080"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: GrelotDown
        exp_alerts: []
      - eval_time: 5m
        alertname: GrelotDown
        exp_alerts:
          - exp_labels: {severity: warning, job: grelot, instance: "a:8080"}
            exp_annotations:
              summary: "grelot is down or no longer scraped"
              description: >
                No successful scrape of grelot for 5m, so agents may be unable to
                post, read or be woken, and every other rule here is blind. Check
                the container, the port and the scrape config.

  - name: GrelotDown fires when the target is gone
    interval: 1m
    input_series:
      - series: 'up{job="other",instance="c:9100"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: GrelotDown
        exp_alerts:
          - exp_labels: {severity: warning, job: grelot}
            exp_annotations:
              summary: "grelot is down or no longer scraped"
              description: >
                No successful scrape of grelot for 5m, so agents may be unable to
                post, read or be woken, and every other rule here is blind. Check
                the container, the port and the scrape config.

  - name: GrelotSweepStalled fires two minutes after the sweep is two minutes old
    interval: 1m
    input_series:
      # A sweep commits every minute up to 3m, then none.
      - series: 'grelot_sweep_last_success_timestamp_seconds{job="grelot",instance="a:8080"}'
        values: "0+60x3 180x10"
      # A sweep that keeps committing.
      - series: 'grelot_sweep_last_success_timestamp_seconds{job="grelot",instance="b:8080"}'
        values: "0+60x13"
    alert_rule_test:
      - eval_time: 7m
        alertname: GrelotSweepStalled
        exp_alerts: []
      - eval_time: 8m
        alertname: GrelotSweepStalled
        exp_alerts:
          - exp_labels: {severity: warning, job: grelot, instance: "a:8080"}
            exp_annotations:
              summary: "grelot's store sweep has not committed for over two minutes"
              description: >
                Reservations are not freed, identities do not expire and hand-offs
                do not fire. Each failed pass logs a sweep failed ERROR line with
                the cause. With no such line, the process may be stuck.

  - name: GrelotStoreStartedEmpty fires for a corrupt file, not a format reset
    interval: 1m
    input_series:
      - series: 'grelot_store_started_empty_total{job="grelot",instance="a:8080",reason="corrupt"}'
        values: "1x5"
      - series: 'grelot_store_started_empty_total{job="grelot",instance="b:8080",reason="corrupt"}'
        values: "0x5"
      - series: 'grelot_store_started_empty_total{job="grelot",instance="b:8080",reason="format"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: GrelotStoreStartedEmpty
        exp_alerts:
          - exp_labels: {severity: info, job: grelot, instance: "a:8080", reason: corrupt}
            exp_annotations:
              summary: "grelot found its store file corrupt and started empty"
              description: >
                Agents must register again, and unexpired posts and reservations
                are gone. The ERROR line names the file grelot moved aside, which
                you can inspect or delete.

  - name: GrelotStoreNearlyFull fires after ten minutes above 80 %
    interval: 1m
    input_series:
      - series: 'grelot_store_in_use_bytes{job="grelot",instance="a:8080"}'
        values: "850x15"
      - series: 'grelot_store_max_bytes{job="grelot",instance="a:8080"}'
        values: "1000x15"
      - series: 'grelot_store_in_use_bytes{job="grelot",instance="b:8080"}'
        values: "800x15"
      - series: 'grelot_store_max_bytes{job="grelot",instance="b:8080"}'
        values: "1000x15"
    alert_rule_test:
      - eval_time: 9m
        alertname: GrelotStoreNearlyFull
        exp_alerts: []
      - eval_time: 10m
        alertname: GrelotStoreNearlyFull
        exp_alerts:
          - exp_labels: {severity: warning, job: grelot, instance: "a:8080"}
            exp_annotations:
              summary: "grelot's store is over 80 % of STORE_MAX_BYTES"
              description: >
                Above 90 % grelot refuses new posts. Raise STORE_MAX_BYTES, or
                shorten THREAD_TTL so old threads expire sooner.

  - name: GrelotStoreFull fires above 90 %, where posts are refused, and not at it
    interval: 1m
    input_series:
      - series: 'grelot_store_in_use_bytes{job="grelot",instance="a:8080"}'
        values: "901x5"
      - series: 'grelot_store_max_bytes{job="grelot",instance="a:8080"}'
        values: "1000x5"
      - series: 'grelot_store_in_use_bytes{job="grelot",instance="b:8080"}'
        values: "900x5"
      - series: 'grelot_store_max_bytes{job="grelot",instance="b:8080"}'
        values: "1000x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: GrelotStoreFull
        exp_alerts:
          - exp_labels: {severity: critical, job: grelot, instance: "a:8080"}
            exp_annotations:
              summary: "grelot's store is full and new posts are refused"
              description: >
                The bytes in use are above 90 % of STORE_MAX_BYTES, so every post
                gets a 507. Raise STORE_MAX_BYTES and restart, or wait for old
                threads to expire.

  - name: GrelotServerErrors fires for a 500 on a series that already existed
    interval: 1m
    input_series:
      # The first sample sits 15m back from 15m on, so only increase() can
      # see the second 500, at 21m.
      - series: 'grelot_http_requests_total{job="grelot",instance="a:8080",route="/v1/posts",code="500"}'
        values: "1x20 2x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: GrelotServerErrors
        exp_alerts: []
      - eval_time: 25m
        alertname: GrelotServerErrors
        exp_alerts: []
      - eval_time: 26m
        alertname: GrelotServerErrors
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "grelot answered requests with a server error"
              description: >
                grelot returned a 5xx other than 503 or 507 in the last 15m. Each
                500 has a request failed ERROR line naming the cause.
      - eval_time: 36m
        alertname: GrelotServerErrors
        exp_alerts: []

  - name: GrelotServerErrors fires for the first error on a route and clears after 15m
    interval: 1m
    input_series:
      - series: 'grelot_http_requests_total{job="grelot",instance="a:8080",route="/v1/inbox",code="500"}'
        values: "_x2 1x30"
    alert_rule_test:
      - eval_time: 6m
        alertname: GrelotServerErrors
        exp_alerts: []
      - eval_time: 7m
        alertname: GrelotServerErrors
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "grelot answered requests with a server error"
              description: >
                grelot returned a 5xx other than 503 or 507 in the last 15m. Each
                500 has a request failed ERROR line naming the cause.
      - eval_time: 18m
        alertname: GrelotServerErrors
        exp_alerts: []

  - name: GrelotServerErrors ignores a full store, a timeout, the health route and success
    interval: 1m
    input_series:
      # A post past its route timeout, which may still have been stored.
      - series: 'grelot_http_requests_total{job="grelot",instance="a:8080",route="/v1/posts",code="503"}'
        values: "_x2 1+1x30"
      - series: 'grelot_http_requests_total{job="grelot",instance="a:8080",route="/v1/posts",code="507"}'
        values: "0+1x30"
      - series: 'grelot_http_requests_total{job="grelot",instance="a:8080",route="/healthz",code="503"}'
        values: "0+1x30"
      - series: 'grelot_http_requests_total{job="grelot",instance="a:8080",route="/v1/posts",code="201"}'
        values: "0+1x30"
      - series: 'grelot_http_requests_total{job="grelot",instance="a:8080",route="/v1/me",code="404"}'
        values: "_x2 1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: GrelotServerErrors
        exp_alerts: []

  - name: GrelotPushFailing fires for a door with failures and no accepted send
    interval: 1m
    input_series:
      # Every try through this door is retried, then given up.
      - series: 'grelot_push_sends_total{job="grelot",instance="a:8080",door="host/push",outcome="accepted"}'
        values: "0x20"
      - series: 'grelot_push_sends_total{job="grelot",instance="a:8080",door="host/push",outcome="retry"}'
        values: "0 0 1+1x18"
      - series: 'grelot_push_sends_total{job="grelot",instance="a:8080",door="host/push",outcome="gave_up"}'
        values: "0x20"
      # This door fails some tries but accepts others.
      - series: 'grelot_push_sends_total{job="grelot",instance="a:8080",door="other/push",outcome="accepted"}'
        values: "0 0 1+1x18"
      - series: 'grelot_push_sends_total{job="grelot",instance="a:8080",door="other/push",outcome="retry"}'
        values: "0 0 1+1x18"
      # This door only meets closed sessions.
      - series: 'grelot_push_sends_total{job="grelot",instance="a:8080",door="third/push",outcome="accepted"}'
        values: "0x20"
      - series: 'grelot_push_sends_total{job="grelot",instance="a:8080",door="third/push",outcome="gone"}'
        values: "0 0 1+1x18"
    alert_rule_test:
      - eval_time: 6m
        alertname: GrelotPushFailing
        exp_alerts: []
      - eval_time: 7m
        alertname: GrelotPushFailing
        exp_alerts:
          - exp_labels: {severity: warning, job: grelot, instance: "a:8080", door: host/push}
            exp_annotations:
              summary: "grelot cannot push to door host/push"
              description: >
                Every push through this door failed for 15m, so agents it serves
                wake later, through their own waits. Nothing is lost. The push
                failed lines give the status the receiver answered.

  - name: GrelotPushDoorOff fires for a door turned off
    interval: 1m
    input_series:
      - series: 'grelot_push_door_up{job="grelot",instance="a:8080",door="host/push"}'
        values: "1 0x5"
      - series: 'grelot_push_door_up{job="grelot",instance="a:8080",door="other/push"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 0m
        alertname: GrelotPushDoorOff
        exp_alerts: []
      - eval_time: 1m
        alertname: GrelotPushDoorOff
        exp_alerts:
          - exp_labels: {severity: warning, job: grelot, instance: "a:8080", door: host/push}
            exp_annotations:
              summary: "grelot turned push door host/push off"
              description: >
                The receiver refused the door's credential, so grelot stopped
                pushing through it until restart. Agents it serves wake later,
                through their own waits. Fix the credential, then restart grelot.

  - name: GrelotProviderInvalid fires while a provider file is skipped
    interval: 1m
    input_series:
      - series: 'grelot_providers_invalid{job="grelot",instance="a:8080"}'
        values: "2x5"
      - series: 'grelot_providers_invalid{job="grelot",instance="b:8080"}'
        values: "0x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: GrelotProviderInvalid
        exp_alerts:
          - exp_labels: {severity: warning, job: grelot, instance: "a:8080"}
            exp_annotations:
              summary: "grelot skipped a provider file, or its providers folder, at startup"
              description: >
                A skipped file's doors push nothing, and an unreadable folder
                leaves no door at all. Each provider invalid ERROR line names the
                file or folder and the problem. Fix it, then restart grelot.
